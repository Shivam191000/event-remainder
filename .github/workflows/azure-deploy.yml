name: Deploy Event Reminder to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  WEBAPP_NAME: 'event-reminder-app'
  RESOURCE_GROUP: 'event-reminder-rg'

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Create deployment package
        run: |
          # Create a zip of what we need: backend + frontend
          mkdir -p deployment
          cp -r backend deployment/
          cp -r frontend deployment/
          cp .npmrc deployment/ 2>/dev/null || true
          # Remove node_modules from zip (Azure will install on startup)
          rm -rf deployment/backend/node_modules
          # Remove SQLite DB (Azure uses ephemeral storage, we'll let it create fresh)
          rm -f deployment/backend/events.db
          cd deployment
          zip -r ../deploy.zip . -x "*.git*"
          cd ..
          echo "Deployment package created: $(du -sh deploy.zip)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: deploy.zip

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "App URL: https://${{ env.WEBAPP_NAME }}.azurewebsites.net"
          sleep 30
          curl -sf "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health" && echo "Health check PASSED" || echo "Health check pending (app may still be starting)"
