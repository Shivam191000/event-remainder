name: Deploy Event Reminder to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  WEBAPP_NAME: 'event-reminder-app'
  RESOURCE_GROUP: 'event-reminder-rg'

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Create deployment package
        run: |
          # Azure's Oryx builder needs package.json at the ROOT of the zip.
          # Structure: server.js, package.json, db.js, routes/, middleware/ at root
          #            frontend/ as a sibling directory

          mkdir -p deploy_pkg/routes
          mkdir -p deploy_pkg/middleware
          mkdir -p deploy_pkg/frontend

          # Copy backend files to root of deploy package
          cp backend/server.js deploy_pkg/
          cp backend/db.js deploy_pkg/
          cp backend/package.json deploy_pkg/
          cp backend/package-lock.json deploy_pkg/
          cp .npmrc deploy_pkg/ 2>/dev/null || true
          cp backend/routes/*.js deploy_pkg/routes/
          cp backend/middleware/*.js deploy_pkg/middleware/

          # Copy frontend as sibling
          cp -r frontend/. deploy_pkg/frontend/

          # Remove events.db if present (fresh start on Azure)
          rm -f deploy_pkg/events.db

          # Zip it up
          cd deploy_pkg
          zip -r ../deploy.zip .
          cd ..
          echo "Package size: $(du -sh deploy.zip)"
          echo "Package contents:"
          unzip -l deploy.zip | head -30

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure startup command
        run: |
          az webapp config set \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --startup-file "node server.js" \
            --output none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: deploy.zip

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "App URL: https://${{ env.WEBAPP_NAME }}.azurewebsites.net"
          sleep 45
          curl -sf "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health" \
            && echo "Health check PASSED" \
            || echo "App still starting — check Azure portal in a minute"
